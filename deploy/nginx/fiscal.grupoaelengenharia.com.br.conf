# =============================================================================================================
# CTRL Fiscal — site do Nginx DO HOST (VPS) para fiscal.grupoaelengenharia.com.br.
#
# Este arquivo contém SOMENTE os server blocks deste domínio. Não altera nenhum outro site do servidor
# (ex.: o sistema Carreiras em 127.0.0.1:3001 continua com o próprio arquivo, intocado).
#
# Instalação SEGURA (como root, na VPS; nunca "systemctl restart nginx", só reload):
#   1. Descubra se já existe um arquivo para este domínio (o Certbot costuma editar o site existente):
#        grep -rl 'fiscal.grupoaelengenharia.com.br' /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null
#   2. Faça backup do arquivo encontrado (NÃO mexa em arquivos de outros domínios):
#        cp -a /etc/nginx/sites-available/<arquivo> /root/nginx-backup-<arquivo>-$(date +%Y%m%d-%H%M%S)
#   3. Ajuste HTTP_PORT abaixo (proxy_pass) se o .env da VPS usar porta diferente de 8088 (NUNCA 3001).
#   4. Instale este arquivo no lugar do site do domínio (mesmo nome do arquivo encontrado, ou este nome):
#        install -m 644 deploy/nginx/fiscal.grupoaelengenharia.com.br.conf /etc/nginx/sites-available/fiscal.grupoaelengenharia.com.br.conf
#        ln -sfn /etc/nginx/sites-available/fiscal.grupoaelengenharia.com.br.conf /etc/nginx/sites-enabled/fiscal.grupoaelengenharia.com.br.conf
#      Se o site antigo tinha OUTRO nome em sites-enabled, remova só o link dele (o backup do passo 2 permanece).
#      Nunca deixe dois server blocks com o mesmo server_name na mesma porta.
#   5. Teste e recarregue:
#        nginx -t && systemctl reload nginx
#      Se "nginx -t" falhar, NÃO recarregue: restaure o backup do passo 2 e repita "nginx -t".
#   6. Confira:  curl -sI http://fiscal.grupoaelengenharia.com.br/login   (301 para https, um salto)
#                curl -sI https://fiscal.grupoaelengenharia.com.br/login  (200, com Strict-Transport-Security)
#                curl -sI http://127.0.0.1:3001/   (o outro sistema continua respondendo como antes)
# Renovação do certificado: continua a cargo do Certbot (timer do sistema); este arquivo só lê os caminhos.
# Confira o método em /etc/letsencrypt/renewal/fiscal.grupoaelengenharia.com.br.conf: com "authenticator = nginx"
# (padrão do "certbot --nginx") nada mais é necessário; o HTTP-01 da Let's Encrypt também segue o 301 abaixo.
# Se for "webroot", acrescente ao server da porta 80, ANTES do "return", o location do webroot indicado lá:
#     location ^~ /.well-known/acme-challenge/ { root <webroot_path>; }
# Teste a renovação sem emitir: certbot renew --dry-run --cert-name fiscal.grupoaelengenharia.com.br
# =============================================================================================================

# HTTP: somente redireciona para HTTPS (um único 301; o destino é HTTPS, então não há ciclo).
server {
    listen 80;
    listen [::]:80;
    server_name fiscal.grupoaelengenharia.com.br;
    return 301 https://$host$request_uri;
}

server {
    # HTTP/2 na forma do Nginx >= 1.25.1 (Debian 13 traz 1.26). Em Nginx mais antigo, troque as três linhas por
    # "listen 443 ssl http2;" e "listen [::]:443 ssl http2;".
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fiscal.grupoaelengenharia.com.br;

    # Certificado emitido pelo Certbot (já existente na VPS).
    ssl_certificate     /etc/letsencrypt/live/fiscal.grupoaelengenharia.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fiscal.grupoaelengenharia.com.br/privkey.pem;
    # Parâmetros TLS que o Certbot instala. Se o seu site atual já os inclui (ou se o arquivo não existir neste
    # servidor), mantenha exatamente o que o Certbot gerou: incluir duas vezes causa erro de diretiva duplicada.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS só para ESTE host (sem includeSubDomains/preload: não afeta outros subdomínios da empresa).
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Limite externo de corpo, igual ao maior limite do gateway (importação de XML/ZIP: 26 MB).
    client_max_body_size 26m;

    location / {
        # AJUSTE a porta se HTTP_PORT do .env da VPS for diferente de 8088 (nunca 3001).
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SOBRESCREVE (não acrescenta) o X-Forwarded-For: o cliente não consegue forjar o próprio IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        # proxy_buffering: padrão do Nginx (ligado).
    }
}
