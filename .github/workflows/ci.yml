# CTRL Fiscal — integração contínua. Somente verificação: NÃO publica imagens e NÃO implanta.
# Nenhum segredo real é usado; o MySQL do job opcional recebe uma senha aleatória gerada no próprio job.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mysql:
        description: "Rodar também a suíte contra MySQL 8.4"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicacao:
    name: Arquivos proibidos no repositório
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nenhum segredo, certificado, dump ou evidência versionado
        run: |
          proibidos="$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.|\.pfx$|\.p12$|\.pem$|\.key$|\.sql(\.gz)?$|\.dump$|^secrets|^backups/|^data/|^docs/evidencias/|^docs/oficial/producao/|^docs/oficial/producao-restrita/|^docs/oficial/regras-dps-anexo-i\.json' \
            | grep -v -E '^\.env\.example$|^services/nfse-api/nfse_api/icp_ancoras/[a-z]+\.pem$|^docs/evidencias/\.gitkeep$' || true)"
          if [ -n "$proibidos" ]; then
            echo "::error::arquivos que não podem ser publicados:"; printf '%s\n' "$proibidos"; exit 1
          fi
          if git grep -I -l -E -e '-----BEGIN ([A-Z]+ )?PRIVATE KEY-----' ; then
            echo "::error::chave privada encontrada em arquivo versionado"; exit 1
          fi
      - name: Scripts de implantação (sintaxe e shellcheck)
        run: |
          for f in deploy/*.sh infra/mysql/init/*.sh; do bash -n "$f"; done
          shellcheck -x -S warning deploy/*.sh infra/mysql/init/*.sh
      - name: Finais de linha LF nos scripts de shell
        run: |
          if git ls-files --eol '*.sh' | grep -v 'i/lf'; then echo "::error::script .sh com CRLF"; exit 1; fi

  python:
    name: Testes Python (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # mesma versão das imagens (python:3.13-slim-bookworm)
          cache: pip
          cache-dependency-path: |
            services/requirements.txt
            tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - name: pytest (SQLite em arquivo temporário)
        run: python -m pytest tests -q -p no:cacheprovider -W ignore

  python-mysql:
    name: Testes Python (MySQL 8.4, opcional)
    # Opcional: roda em push na main e sob demanda (workflow_dispatch com mysql=true).
    if: github.event_name == 'workflow_dispatch' && inputs.mysql || github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            services/requirements.txt
            tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - name: MySQL 8.4 efêmero (credencial aleatória gerada aqui)
        run: |
          PW="$(openssl rand -hex 24)"
          echo "::add-mask::$PW"
          MYSQL_ROOT_PASSWORD="$PW" docker run -d --name mysql-ci -e MYSQL_ROOT_PASSWORD \
            -p 127.0.0.1:3306:3306 mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242 \
            --max-connections=500
          for i in $(seq 1 90); do
            if docker exec -e MYSQL_PWD="$PW" mysql-ci mysqladmin -uroot -h127.0.0.1 --protocol=tcp ping --silent 2>/dev/null; then break; fi
            sleep 2
          done
          echo "CTRL_TEST_MYSQL_URL=mysql+pymysql://root:${PW}@127.0.0.1:3306" >> "$GITHUB_ENV"
      - name: pytest (MySQL)
        run: python -m pytest tests -q -p no:cacheprovider -W ignore
      - name: Remove o MySQL efêmero
        if: always()
        run: docker rm -f mysql-ci || true

  typescript:
    name: Typecheck e testes TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"   # mesma versão das imagens (node:20-alpine)
          cache: npm
      - run: npm ci
      - name: Build dos pacotes compartilhados (tipos em dist/)
        run: |
          npm run build --workspace=@ctrl-fiscal/api-client
          npm run build --workspace=@ctrl-fiscal/ui
      - name: Typecheck
        run: |
          npm run typecheck --workspace=@ctrl-fiscal/api-client
          npm run typecheck --workspace=@ctrl-fiscal/ui
          npx tsc --noEmit -p apps/painel-fiscal
          npm run typecheck --workspace=@ctrl-fiscal/web
      - name: Testes do api-client
        run: node --test --import tsx packages/api-client/test/*.test.ts
      - name: Testes do painel fiscal
        run: node --test --import tsx apps/painel-fiscal/test/*.test.ts

  docker:
    name: Build das imagens (sem push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: |
          V="$(git rev-parse --short=12 HEAD)"
          for s in core-api fiscal-api fiscal-worker nfse-api; do
            docker buildx build --load -f "services/$s/Dockerfile" -t "ctrlfiscal/$s:$V" services
          done
          for s in web painel-fiscal; do
            docker buildx build --load -f "apps/$s/Dockerfile" -t "ctrlfiscal/$s:$V" .
          done
          docker image ls 'ctrlfiscal/*'
      - name: Compose de produção válido (valores fictícios)
        run: |
          sed -e "s/^VERSAO=.*/VERSAO=$(git rev-parse --short=12 HEAD)/" \
              -e 's/^DOMINIO=.*/DOMINIO=fiscal.exemplo.invalid/' \
              deploy/env.producao.exemplo > "$RUNNER_TEMP/env-ci"
          docker compose --env-file "$RUNNER_TEMP/env-ci" -f compose.yaml -f deploy/compose.prod.yaml config --quiet
          COMPOSE_PROFILES=ativo docker compose --env-file "$RUNNER_TEMP/env-ci" -f compose.yaml -f deploy/compose.prod.yaml config --services
