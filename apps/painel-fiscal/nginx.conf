server {
    listen 8080;
    server_name localhost;

    location /fiscal/ {
        alias /usr/share/nginx/html/fiscal/;
        try_files $uri $uri/ /fiscal/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Redireciona raiz do container para /fiscal/
    location = / {
        return 301 /fiscal/;
    }
}
